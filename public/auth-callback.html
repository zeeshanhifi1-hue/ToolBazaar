<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolBazaar — Completing Sign In</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #090713;
        color: #f4f2ff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        max-width: 340px;
        padding: 24px;
        border-radius: 20px;
        background: #141026;
        border: 1px solid rgba(167, 139, 250, 0.35);
        text-align: center;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #c8c1e8;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p id="status">Completing Google sign-in...</p>
    </div>
    <script>
      (function () {
        var statusEl = document.getElementById('status');
        var searchParams = new URLSearchParams(window.location.search);
        var hashParams = new URLSearchParams(
          window.location.hash ? window.location.hash.slice(1) : ''
        );

        var code = searchParams.get('code') || '';
        var accessToken = hashParams.get('access_token') || '';
        var refreshToken = hashParams.get('refresh_token') || '';
        var error =
          searchParams.get('error_description') ||
          searchParams.get('error') ||
          hashParams.get('error_description') ||
          hashParams.get('error') ||
          '';

        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage(
              {
                type: 'TOOLBAZAAR_SUPABASE_OAUTH',
                code: code,
                accessToken: accessToken,
                refreshToken: refreshToken,
                error: error,
              },
              window.location.origin
            );
            if (statusEl) {
              statusEl.textContent = error
                ? 'Sign-in was not completed. You can close this window.'
                : 'Signed in! Returning to ToolBazaar...';
            }
            window.setTimeout(function () {
              window.close();
            }, 250);
            return;
          } catch (_err) {
            // Fall through to top-level navigation if opener is cross-origin
          }
        }

        // Direct full-page fallback when not opened via popup
        var target =
          window.location.origin +
          '/' +
          (window.location.search || '') +
          (window.location.hash || '');
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
